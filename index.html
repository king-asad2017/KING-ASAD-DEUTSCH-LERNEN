<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KING ASAD – مرکز آموزش زبان آلمانی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800&family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
    --page-bg: #f1f3f6;
    --panel-bg: #ffffff;
    --ink: #162238;
    --muted: #586984;
    --border: #dfe5ee;

    /* ۴ رنگ اصلی ردیف‌های افقی */
    --c1-main: #2a78be;
    --c1-dark: #1d5b93;
    --c1-soft: #eef5fc;

    --c2-main: #c63b7a;
    --c2-dark: #97285b;
    --c2-soft: #fdf0f6;

    --c3-main: #d87a28;
    --c3-dark: #a65916;
    --c3-soft: #fef5ec;

    --c4-main: #4da347;
    --c4-dark: #377b32;
    --c4-soft: #f0f9ef;

    --radius-sm: 10px;
    --radius-md: 14px;
    --shadow-row: 0 5px 14px rgba(18, 28, 45, 0.08);
    --shadow-drawer: 0 12px 28px rgba(18, 28, 45, 0.11);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    min-height: 100vh;
    font-family: "Vazirmatn", "Cairo", "Inter", Tahoma, Arial, sans-serif;
    background: var(--page-bg);
    color: var(--ink);
    line-height: 1.75;
}

.app-shell {
    max-width: 980px;
    margin: 0 auto;
    padding: 24px 16px 36px;
}

/* هدر بزرگ و مدرن در بالا */
.site-header {
    background: linear-gradient(135deg, #13233c 0%, #1f3c68 100%);
    color: #ffffff;
    border-radius: var(--radius-md);
    padding: 22px 24px;
    margin-bottom: 22px;
    box-shadow: 0 10px 24px rgba(19, 35, 60, 0.16);
    border-bottom: 4px solid #e6b447;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
}

.brand-block {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.brand-kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 800;
    color: #ffd875;
    letter-spacing: 0.4px;
}

.site-title {
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 900;
    line-height: 1.25;
    color: #ffffff;
}

.site-subtitle {
    font-size: 13.5px;
    color: #d5e2f5;
}

.header-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.level-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    background: rgba(255, 255, 255, 0.08);
    padding: 6px;
    border-radius: var(--radius-sm);
}

.lvl-chip {
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: transparent;
    color: #eef4fc;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 800;
    padding: 5px 11px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.lvl-chip:hover,
.lvl-chip.active {
    background: #ffd875;
    color: #13233c;
    border-color: #ffd875;
}

/* چهار چوکات افقی (مربع سمت راست + نوار طویل سمت چپ در حالت RTL) */
.stacked-rows {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.row-group {
    --row-main: var(--c1-main);
    --row-dark: var(--c1-dark);
    --row-soft: var(--c1-soft);
}

.row-group[data-color="blue"] {
    --row-main: var(--c1-main);
    --row-dark: var(--c1-dark);
    --row-soft: var(--c1-soft);
}

.row-group[data-color="rose"] {
    --row-main: var(--c2-main);
    --row-dark: var(--c2-dark);
    --row-soft: var(--c2-soft);
}

.row-group[data-color="orange"] {
    --row-main: var(--c3-main);
    --row-dark: var(--c3-dark);
    --row-soft: var(--c3-soft);
}

.row-group[data-color="green"] {
    --row-main: var(--c4-main);
    --row-dark: var(--c4-dark);
    --row-soft: var(--c4-soft);
}

.row-trigger {
    width: 100%;
    display: grid;
    grid-template-columns: 74px 12px 1fr;
    align-items: stretch;
    background: transparent;
    border: none;
    cursor: pointer;
    text-align: right;
    font-family: inherit;
    filter: drop-shadow(var(--shadow-row));
    transition: transform 0.2s ease;
}

.row-trigger:hover {
    transform: translateY(-2px);
}

.row-square {
    background: linear-gradient(180deg, #ffffff 0%, #f4f6fa 100%);
    border: 3.5px solid var(--row-main);
    border-radius: var(--radius-sm);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 74px;
    color: var(--row-dark);
    font-weight: 900;
}

.row-num {
    font-size: 18px;
    line-height: 1.1;
}

.row-emoji {
    font-size: 18px;
    line-height: 1.2;
}

.row-bridge {
    background: var(--row-dark);
    margin: 12px 0;
}

.row-bar {
    background: linear-gradient(180deg, #ffffff 0%, #f7f9fc 100%);
    border: 3.5px solid var(--row-main);
    border-radius: var(--radius-sm);
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 74px;
}

.row-bar-content {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.row-title {
    font-size: 17px;
    font-weight: 900;
    color: var(--ink);
}

.row-desc {
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
}

.row-status-pill {
    background: var(--row-soft);
    color: var(--row-dark);
    border: 1.5px solid var(--row-main);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
}

.row-trigger[aria-expanded="true"] .row-bar {
    background: var(--row-soft);
}

/* کشوی محتوا که دقیقاً زیر همان ردیف باز می‌شود */
.row-drawer {
    display: none;
    background: var(--panel-bg);
    border: 2px solid var(--row-main);
    border-top: 4px solid var(--row-main);
    border-radius: var(--radius-md);
    margin-top: 8px;
    padding: 18px;
    box-shadow: var(--shadow-drawer);
}

.row-drawer.open {
    display: block;
    animation: fadeSlide 0.22s ease;
}

@keyframes fadeSlide {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
}

/* آکاردئون داخلی درس‌ها و بخش‌ها */
.level-switcher-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
}

.lvl-filter-btn {
    padding: 6px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: #f8fafc;
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
}

.lvl-filter-btn.active {
    background: var(--row-main);
    color: #ffffff;
    border-color: var(--row-main);
}

.lesson-item {
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    background: #fcfdff;
    overflow: hidden;
}

.lesson-head-btn {
    width: 100%;
    padding: 11px 14px;
    background: #f5f8fc;
    border: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    text-align: right;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    color: var(--ink);
    cursor: pointer;
}

.lesson-head-btn.open {
    background: var(--row-soft);
    color: var(--row-dark);
}

.lesson-body {
    display: none;
    padding: 14px;
    border-top: 1px solid var(--border);
    background: #ffffff;
}

.lesson-body.open {
    display: block;
}

.sub-card {
    background: #f9fbfe;
    border: 1px solid var(--border);
    border-inline-start: 4px solid var(--row-main);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
}

.sub-card h4 {
    font-size: 14.5px;
    font-weight: 800;
    color: var(--row-dark);
    margin-bottom: 6px;
}

.line-row,
.vocab-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    background: #ffffff;
    border: 1px solid #e7ecf3;
    margin-bottom: 6px;
}

.audio-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.btn-audio-de,
.btn-audio-fa,
.btn-primary,
.btn-secondary {
    border: none;
    border-radius: 7px;
    padding: 6px 11px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
}

.btn-audio-de {
    background: #1d5b93;
    color: #fff;
}

.btn-audio-fa {
    background: #377b32;
    color: #fff;
}

.btn-primary {
    background: var(--row-main);
    color: #fff;
    padding: 8px 15px;
    font-size: 13px;
}

.btn-secondary {
    background: #e9eef5;
    color: var(--ink);
    padding: 8px 14px;
    font-size: 13px;
}

.btn-audio-de:hover,
.btn-audio-fa:hover,
.btn-primary:hover,
.btn-secondary:hover {
    opacity: 0.92;
    transform: translateY(-1px);
}

input[type="text"],
select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #cfd8e6;
    border-radius: 9px;
    font-family: inherit;
    font-size: 14px;
    background: #fff;
    color: var(--ink);
    margin: 6px 0 10px;
}

.result-banner {
    background: #fff8e6;
    border: 1px solid #edd082;
    border-inline-start: 4px solid #d87a28;
    border-radius: 9px;
    padding: 10px 14px;
    margin: 10px 0;
    font-weight: 700;
    font-size: 13.5px;
}

.video-frame {
    width: 100%;
    max-width: 680px;
    aspect-ratio: 16 / 9;
    border: 0;
    border-radius: 10px;
    display: block;
    margin: 8px 0;
}

/* فوتر کوچک با ساعت و تاریخ زنده در پایین */
.site-footer {
    max-width: 980px;
    margin: 22px auto 0;
    padding: 10px 16px;
    background: #13233c;
    color: #e6eef9;
    border-radius: var(--radius-sm);
    border-top: 3px solid #e6b447;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 12.5px;
    font-weight: 700;
}

.clock-pill {
    background: rgba(255, 255, 255, 0.1);
    color: #ffd875;
    padding: 3px 10px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
}

@media (max-width: 600px) {
    .row-trigger {
        grid-template-columns: 60px 8px 1fr;
    }
    .row-square {
        min-height: 64px;
    }
    .row-bar {
        min-height: 64px;
        padding: 10px 12px;
    }
    .row-title {
        font-size: 15px;
    }
}
</style>
</head>
<body>

<div class="app-shell">
    <header class="site-header">

            <div class="row-drawer" id="drawer-videos"></div>

        <!-- چوکات ۰۴: آزمون‌ها و ثبت پیشرفت -->
        <section class="row-group" data-color="green" id="group-quiz">

            <div class="row-drawer" id="drawer-quiz"></div>

    </main>

    <footer class="site-footer">

        <span class="clock-pill" id="liveClockDate">در حال بارگذاری ساعت و تاریخ...</span>
    </footer>
</div>

function buildLessonData() {
    const result = {};
    LEVELS.forEach(level => {
        const bank = vocabularyBanks[level];
        result[level] = lessonTitles[level].map((title, index) => {
            const start = (index * 3) % bank.length;
            const words = Array.from({ length: 5 }, (_, n) => bank[(start + n) % bank.length]);
            const dialog = dialogTemplates[level].map(line => [line[0], line[1]]);
            const grammar = grammarByLevel[level][index % grammarByLevel[level].length];
            return { title, words, dialog, grammar };
        });
    });
    return result;
}

const lessonData = buildLessonData();
let activeRowKey = null;
let selectedLevelFilter = 'ALL';

function escapeAttr(str) {
    return String(str ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function speakText(text, lang = 'de-DE') {
    const clean = String(text ?? '').trim();
    if (!clean) return;
    if (!('speechSynthesis' in window)) {
        alert('مرورگر شما از پخش صدا پشتیبانی نمی‌کند.');
        return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(clean);
    utterance.lang = lang;
    utterance.rate = lang === 'de-DE' ? 0.85 : 0.95;
    window.speechSynthesis.speak(utterance);
}

function toggleMainRow(key, forceOpen = false) {
    const shouldOpen = forceOpen ? true : (activeRowKey !== key);
    activeRowKey = shouldOpen ? key : null;

    ['lessons', 'dictionary', 'videos', 'quiz'].forEach(k => {
        const group = document.getElementById('group-' + k);
        const trigger = group?.querySelector('.row-trigger');
        const drawer = document.getElementById('drawer-' + k);
        const pill = document.getElementById('pill-' + k);
        const isOpen = (activeRowKey === k);

        if (trigger) trigger.setAttribute('aria-expanded', String(isOpen));
        if (pill) pill.textContent = isOpen ? 'بستن' : 'باز کردن';
        if (drawer) {
            drawer.classList.toggle('open', isOpen);
            if (isOpen && !drawer.dataset.rendered) {
                renderDrawerContent(k, drawer);
                drawer.dataset.rendered = '1';
            }
        }
    });
}

function renderDrawerContent(key, drawer) {
    if (key === 'lessons') {
        drawer.innerHTML = buildLessonsDrawerHtml();
        bindLessonAccordions(drawer);
    } else if (key === 'dictionary') {
        drawer.innerHTML = buildDictionaryDrawerHtml();
        renderDictionaryMatches('');
    } else if (key === 'videos') {
        drawer.innerHTML = buildVideosDrawerHtml();
    } else if (key === 'quiz') {
        drawer.innerHTML = buildQuizDrawerHtml();
    }
}

                            <div class="lesson-item">
                                <button type="button" class="lesson-head-btn" onclick="toggleLessonItem(this, '${lvl}', ${num})">
                                    <span>درس ${num}: ${les.title}</span>
                                    <span>+</span>
                                </button>
                                <div class="lesson-body" id="les-body-${lvl}-${num}"></div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        `;
    });

    return html;
}

window.setLevelFilter = function(lvl) {
    selectedLevelFilter = lvl;
    document.querySelectorAll('#quickLevelJump .lvl-chip').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.level === lvl);
    });
    const drawer = document.getElementById('drawer-lessons');
    if (drawer) {
        drawer.innerHTML = buildLessonsDrawerHtml();
        drawer.classList.add('open');
        bindLessonAccordions(drawer);
    }
    if (activeRowKey !== 'lessons') {
        toggleMainRow('lessons', true);
    }
};

function bindLessonAccordions(container) {
    container.querySelectorAll('.lesson-head-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const parentList = btn.closest('.level-lessons-list');
            const body = btn.nextElementSibling;
            const willOpen = !body.classList.contains('open');

            if (parentList) {
                parentList.querySelectorAll('.lesson-body').forEach(b => {
                    b.classList.remove('open');
                    b.innerHTML = '';
                });
                parentList.querySelectorAll('.lesson-head-btn').forEach(h => {
                    h.classList.remove('open');
                    if (h.lastElementChild) h.lastElementChild.textContent = '+';
                });
            }

            if (willOpen && body) {
                const lvl = parentList.dataset.level;
                const index = Array.from(parentList.querySelectorAll('.lesson-head-btn')).indexOf(btn);
                const data = lessonData[lvl][index];
                body.innerHTML = buildLessonDetailHtml(lvl, index + 1, data);
                body.classList.add('open');
                btn.classList.add('open');
                if (btn.lastElementChild) btn.lastElementChild.textContent = '−';
            }
        });
    });
}

function buildLessonDetailHtml(lvl, num, data) {
    const sampleWord = data.words[0];
    return `
        <div class="sub-card">
            <h4>💬 مکالمه درس ${num} (${lvl})</h4>
            ${data.dialog.map(line => `
                <div class="line-row">
                    <div>
                        <div><strong>🇩🇪 ${line[0]}</strong></div>
                        <div style="color:var(--muted);font-size:13px;">🇦🇫 ${line[1]}</div>
                    </div>
                    <div class="audio-group">
                        <button type="button" class="btn-audio-de" onclick="speakText('${escapeAttr(line[0])}','de-DE')">🔊 آلمانی</button>
                        <button type="button" class="btn-audio-fa" onclick="speakText('${escapeAttr(line[1])}','fa-IR')">🔊 فارسی</button>
                    </div>
                </div>
            `).join('')}
        </div>

        <div class="sub-card">
            <h4>📖 واژگان کلیدی</h4>
            ${data.words.map(w => `
                <div class="vocab-row">
                    <span><strong>${w[0]}</strong> = ${w[1]}</span>
                    <div class="audio-group">
                        <button type="button" class="btn-audio-de" onclick="speakText('${escapeAttr(w[0])}','de-DE')">🔊 آلمانی</button>
                        <button type="button" class="btn-audio-fa" onclick="speakText('${escapeAttr(w[1])}','fa-IR')">🔊 فارسی</button>
                    </div>
                </div>
            `).join('')}
        </div>

        <div class="sub-card">
            <h4>📐 نکته گرامری</h4>
            <p style="font-size:13.5px;">${data.grammar}</p>
        </div>

        <div class="sub-card">
            <h4>✏️ تمرین سریع</h4>
            <p style="font-size:13.5px;">معنی فارسی کلمه <strong>${sampleWord[0]}</strong> را بنویسید:</p>
            <input type="text" id="ans-${lvl}-${num}" placeholder="معنی فارسی را وارد کنید...">
            <button type="button" class="btn-primary" onclick="checkLessonWord('${lvl}', ${num}, '${escapeAttr(sampleWord[1])}')">بررسی پاسخ</button>
            <div id="res-${lvl}-${num}" style="margin-top:8px;font-weight:700;font-size:13px;"></div>
        </div>
    `;
}

window.checkLessonWord = function(lvl, num, expectedFa) {
    const input = document.getElementById(`ans-${lvl}-${num}`);
    const out = document.getElementById(`res-${lvl}-${num}`);
    if (!input || !out) return;
    const norm = s => s.trim().toLocaleLowerCase('fa').replace(/\s+/g, ' ');
    if (norm(input.value) === norm(expectedFa)) {
        out.style.color = '#2c6b27';
        out.textContent = 'آفرین! پاسخ کاملاً درست است.';
    } else {
        out.style.color = '#b34712';
        out.textContent = 'پاسخ صحیح: ' + expectedFa;
    }
};

function buildDictionaryDrawerHtml() {
    return `
        <div class="sub-card">
            <h4>🔎 جستجو و ترجمه دوزبانه‌ی آلمانی ↔ فارسی</h4>
            <input type="text" id="dictQuery" placeholder="کلمه یا جمله را بنویسید (مثلاً: Hallo یا سلام)..." oninput="renderDictionaryMatches(this.value)">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                <select id="dictFrom">
                    <option value="de">مبدأ: آلمانی (de)</option>
                    <option value="fa">مبدأ: فارسی (fa)</option>
                </select>
                <select id="dictTo">
                    <option value="fa">مقصد: فارسی (fa)</option>
                    <option value="de">مقصد: آلمانی (de)</option>
                </select>
            </div>
            <div class="audio-group" style="margin-top:4px;">
                <button type="button" class="btn-primary" onclick="runDictionaryTranslate()">ترجمه آنلاین و داخلی</button>
                <button type="button" class="btn-audio-de" onclick="speakText(document.getElementById('dictQuery').value, 'de-DE')">🔊 تلفظ آلمانی</button>
                <button type="button" class="btn-audio-fa" onclick="speakText(document.getElementById('dictQuery').value, 'fa-IR')">🔊 تلفظ فارسی</button>
            </div>
            <div class="result-banner" id="dictOutput">برای ترجمه کلمه‌ای وارد کنید یا از فهرست واژگان زیر بشنوید.</div>
        </div>
        <div class="sub-card" id="dictListBox"></div>
    `;
}

function getAllWords() {
    const list = [];
    LEVELS.forEach(lvl => {
        (vocabularyBanks[lvl] || []).forEach(([de, fa]) => list.push({ lvl, de, fa }));
    });
    return list;
}

window.renderDictionaryMatches = function(q = '') {
    const box = document.getElementById('dictListBox');
    if (!box) return;
    const term = q.trim().toLowerCase();
    const filtered = getAllWords().filter(item =>
        !term || item.de.toLowerCase().includes(term) || item.fa.toLowerCase().includes(term) || item.lvl.toLowerCase().includes(term)
    );
    box.innerHTML = `<h4>📚 واژگان منتخب (${filtered.length} مورد)</h4>` + filtered.slice(0, 30).map(item => `
        <div class="vocab-row">
            <span><strong>[${item.lvl}] ${item.de}</strong> — ${item.fa}</span>
            <div class="audio-group">
                <button type="button" class="btn-audio-de" onclick="speakText('${escapeAttr(item.de)}','de-DE')">🔊 آلمانی</button>
                <button type="button" class="btn-audio-fa" onclick="speakText('${escapeAttr(item.fa)}','fa-IR')">🔊 فارسی</button>
            </div>
        </div>
    `).join('');
};

window.runDictionaryTranslate = async function() {
    const input = document.getElementById('dictQuery');
    const from = document.getElementById('dictFrom').value;
    const to = document.getElementById('dictTo').value;
    const out = document.getElementById('dictOutput');
    if (!input || !out) return;

    const text = input.value.trim();
    if (!text) {
        out.textContent = 'لطفاً ابتدا کلمه یا جمله را بنویسید.';
        return;
    }
    if (from === to) {
        out.textContent = 'زبان مبدأ و مقصد را متفاوت انتخاب کنید.';
        return;
    }

    const local = getAllWords().find(w => w.de.toLowerCase() === text.toLowerCase() || w.fa.trim() === text);
    out.textContent = '⏳ در حال ترجمه...';

    try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`);
        const data = await res.json();
        const translated = data?.responseData?.translatedText || '';
        out.innerHTML = `${text} ➜ <strong>${translated || (local ? local.fa : 'یافت نشد')}</strong>`;
    } catch {
        out.textContent = local ? `${local.de} = ${local.fa} (حالت آفلاین)` : 'خطا در اتصال به سرویس ترجمه.';
    }
};

function buildVideosDrawerHtml() {
    return LEVELS.map(lvl => {
        const info = levelVideos[lvl];
        const embed = info.id
            ? `<iframe class="video-frame" src="https://www.youtube-nocookie.com/embed/${info.id}" title="${info.title}" allowfullscreen loading="lazy"></iframe>`
            : `<p style="font-size:13px;color:var(--muted);margin:6px 0;">منبع رسمی تمرینی سطح ${lvl} از طریق لینک زیر در دسترس است.</p>`;
        return `
            <div class="sub-card">
                <h4>سطح ${lvl} – ${info.title}</h4>
                ${embed}
                <a href="${info.link}" target="_blank" rel="noopener noreferrer" style="font-size:13px;font-weight:800;color:var(--row-dark);">باز کردن منبع آموزشی ${lvl} ↗</a>
            </div>
        `;
    }).join('');
}

function buildQuizDrawerHtml() {
    return LEVELS.map(lvl => {
        const qs = quizData[lvl] || [];
        return `
            <div class="sub-card">
                <h4>آزمون سطح ${lvl}</h4>
                ${qs.map((q, idx) => `
                    <div class="line-row" style="flex-direction:column;align-items:stretch;">
                        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                            <strong>${idx + 1}. ${q[0]}</strong>
                            <button type="button" class="btn-audio-de" onclick="speakText('${escapeAttr(q[0])}','de-DE')">🔊 صدا</button>
                        </div>
                        <div style="margin-top:6px;">
                            ${q[1].map((opt, oIdx) => `
                                <label style="display:block;margin:4px 0;font-size:13.5px;cursor:pointer;">
                                    <input type="radio" name="q_${lvl}_${idx}" value="${oIdx}"> ${opt}
                                </label>
                            `).join('')}
                        </div>
                    </div>
                `).join('')}
                <button type="button" class="btn-primary" onclick="gradeQuiz('${lvl}')">ثبت امتیاز ${lvl}</button>
                <div id="qres-${lvl}" style="margin-top:8px;font-weight:800;font-size:13.5px;"></div>
            </div>
        `;
    }).join('');
}

window.gradeQuiz = function(lvl) {
    const qs = quizData[lvl] || [];
    const out = document.getElementById('qres-' + lvl);
    let score = 0;
    for (let i = 0; i < qs.length; i++) {
        const checked = document.querySelector(`input[name="q_${lvl}_${i}"]:checked`);
        if (!checked) {
            alert('لطفاً به تمام سؤال‌های این سطح پاسخ دهید.');
            return;
        }
        if (Number(checked.value) === qs[i][2]) score++;
    }
    const pts = score * 10;
    if (out) {
        out.style.color = pts >= 40 ? '#2c6b27' : '#b34712';
        out.textContent = `امتیاز شما: ${pts} از ۵۰ (${score} از ${qs.length} پاسخ صحیح)`;
    }
};

document.querySelectorAll('#quickLevelJump .lvl-chip').forEach(btn => {
    btn.addEventListener('click', () => {
        setLevelFilter(btn.dataset.level);
        const group = document.getElementById('group-lessons');
        if (group) group.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
});

function updateClockAndDate() {
    const el = document.getElementById('liveClockDate');
    if (!el) return;
    const now = new Date();
    const dateStr = new Intl.DateTimeFormat('fa-IR', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    }).format(now);
    const timeStr = new Intl.DateTimeFormat('fa-IR', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    }).format(now);
    el.textContent = `${dateStr} | ${timeStr}`;
}

updateClockAndDate();
setInterval(updateClockAndDate, 1000);
</script>
