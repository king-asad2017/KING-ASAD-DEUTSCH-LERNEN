<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3b0764">
<title>KING ASAD – مرکز جامع آموزش زبان آلمانی (A1–C1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800&family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root {
    --panel-bg: #ffffff;
    --ink: #111827;
    --muted: #4b5563;
    --border: #d8e0ea;

    --c1-main: #2563eb;
    --c1-dark: #1e40af;
    --c1-soft: #eff6ff;

    --c2-main: #db2777;
    --c2-dark: #9d174d;
    --c2-soft: #fdf2f8;

    --c3-main: #ea580c;
    --c3-dark: #9a3412;
    --c3-soft: #fff7ed;

    --c4-main: #16a34a;
    --c4-dark: #166534;
    --c4-soft: #f0fdf4;

    --c5-main: #7c3aed;
    --c5-dark: #5b21b6;
    --c5-soft: #f5f3ff;

    --c6-main: #0891b2;
    --c6-dark: #155e75;
    --c6-soft: #ecfeff;

    --c7-main: #0f766e;
    --c7-dark: #115e59;
    --c7-soft: #f0fdfa;

    --radius-sm: 14px;
    --radius-md: 18px;
    --shadow-row: 0 10px 24px rgba(15, 23, 42, 0.28);
    --shadow-drawer: 0 14px 32px rgba(15, 23, 42, 0.32);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    min-height: 100vh;
    font-family: "Vazirmatn", "Cairo", "Inter", Tahoma, Arial, sans-serif;
    background:
        linear-gradient(160deg, rgba(64, 24, 138, 0.86) 0%, rgba(109, 40, 217, 0.82) 50%, rgba(76, 29, 149, 0.90) 100%),
        url("https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1500&q=80") center/cover fixed no-repeat;
    color: var(--ink);
    line-height: 1.75;
    overflow-x: hidden;
}

.app-shell {
    max-width: 1120px;
    margin: 0 auto;
    padding: 18px 14px 44px;
}

/* Hero header with Student Study Photo + Flags */
.hero-card {
    position: relative;
    background:
        linear-gradient(155deg, rgba(46, 16, 101, 0.88) 0%, rgba(88, 28, 135, 0.84) 55%, rgba(59, 7, 100, 0.90) 100%),
        url("https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1400&q=80") center/cover no-repeat;
    color: #ffffff;
    border-radius: 24px;
    padding: 26px 20px 26px;
    margin-bottom: 18px;
    border: 2px solid rgba(255, 255, 255, 0.24);
    box-shadow: 0 18px 38px rgba(0, 0, 0, 0.42);
    text-align: center;
    overflow: hidden;
}

.flags-strip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    background: rgba(24, 9, 53, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    padding: 6px 14px;
    margin-bottom: 12px;
    font-size: 16px;
}

.hero-brand-line {
    font-size: clamp(20px, 3.8vw, 31px);
    font-weight: 900;
    line-height: 1.35;
    margin-bottom: 12px;
    text-shadow: 0 3px 12px rgba(0, 0, 0, 0.55);
}

.hero-brand-gold {
    color: #facc15;
    font-weight: 900;
}

.hero-slogan-pill {
    background: linear-gradient(135deg, #facc15 0%, #f59e0b 100%);
    color: #1e1035;
    border-radius: 999px;
    padding: 10px 20px;
    margin: 0 auto 14px;
    max-width: 780px;
    font-weight: 900;
    font-size: clamp(13.5px, 2.4vw, 16px);
    line-height: 1.6;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
}

.hero-stats-text {
    font-size: 13.5px;
    font-weight: 700;
    color: #f3e8ff;
    margin-bottom: 16px;
    line-height: 1.8;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
}

.hero-controls-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
}

.hero-lang-select {
    background: rgba(24, 9, 53, 0.82);
    color: #ffffff;
    border: 1.5px solid rgba(255, 255, 255, 0.42);
    border-radius: 14px;
    padding: 9px 16px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 800;
    cursor: pointer;
    width: auto;
    margin: 0;
}

.hero-lang-select option {
    background: #1e1035;
    color: #ffffff;
}

.hero-welcome-btn {
    background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
    color: #1e1035;
    border: none;
    border-radius: 14px;
    padding: 9px 22px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
}

.hero-start-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    max-width: 560px;
    background: linear-gradient(90deg, #e11d48 0%, #ea580c 100%);
    color: #ffffff;
    border: none;
    border-radius: 16px;
    padding: 12px 20px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(225, 29, 72, 0.38);
    transition: transform 0.18s ease;
}

.hero-start-btn:hover {
    transform: translateY(-2px);
}

/* Poster-style 3x3 Level Tiles Grid */
.chaharchookat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 20px;
}

.level-tile {
    border: 2px solid rgba(255, 255, 255, 0.55);
    border-radius: 18px;
    padding: 0;
    color: #ffffff;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: space-between;
    text-align: center;
    background: rgba(255, 255, 255, 0.94);
    overflow: hidden;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.32);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.level-tile:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 28px rgba(0, 0, 0, 0.42);
}

.tile-top-bar {
    padding: 7px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 900;
    font-size: 12px;
    color: #ffffff;
}

.tile-body-box {
    padding: 14px 12px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: #111827;
}

.level-tile.tile-a1 .tile-top-bar { background: linear-gradient(90deg, #1e40af 0%, #2563eb 100%); }
.level-tile.tile-a2 .tile-top-bar { background: linear-gradient(90deg, #166534 0%, #16a34a 100%); }
.level-tile.tile-b1 .tile-top-bar { background: linear-gradient(90deg, #5b21b6 0%, #7c3aed 100%); }
.level-tile.tile-b2 .tile-top-bar { background: linear-gradient(90deg, #9a3412 0%, #ea580c 100%); }
.level-tile.tile-c1 .tile-top-bar { background: linear-gradient(90deg, #155e75 0%, #0891b2 100%); }
.level-tile.tile-all .tile-top-bar { background: linear-gradient(90deg, #831843 0%, #db2777 100%); }

.tile-icon { font-size: 24px; line-height: 1.2; }
.tile-code { font-size: 24px; font-weight: 900; line-height: 1.15; color: #1e1035; }
.tile-sub { font-size: 12px; font-weight: 800; color: #4b5563; }

/* Poster-inspired 3-Column Card Grid: 123 / 456 / 789 / ___ / ___ / ___ */
.three-col-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    align-items: start;
}

.grid-divider-line {
    grid-column: 1 / -1;
    border: none;
    border-top: 2.5px dashed rgba(250, 204, 21, 0.65);
    margin: 8px 0 4px;
}

.stacked-slot-item {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.row-group {
    --row-main: var(--c1-main);
    --row-dark: var(--c1-dark);
    --row-soft: var(--c1-soft);
}

.row-group[data-color="blue"] { --row-main: var(--c1-main); --row-dark: var(--c1-dark); --row-soft: var(--c1-soft); }
.row-group[data-color="rose"] { --row-main: var(--c2-main); --row-dark: var(--c2-dark); --row-soft: var(--c2-soft); }
.row-group[data-color="orange"] { --row-main: var(--c3-main); --row-dark: var(--c3-dark); --row-soft: var(--c3-soft); }
.row-group[data-color="green"] { --row-main: var(--c4-main); --row-dark: var(--c4-dark); --row-soft: var(--c4-soft); }
.row-group[data-color="purple"] { --row-main: var(--c5-main); --row-dark: var(--c5-dark); --row-soft: var(--c5-soft); }
.row-group[data-color="cyan"] { --row-main: var(--c6-main); --row-dark: var(--c6-dark); --row-soft: var(--c6-soft); }
.row-group[data-color="teal"] { --row-main: var(--c7-main); --row-dark: var(--c7-dark); --row-soft: var(--c7-soft); }

/* Poster Card Style: Dark header bar with number + white inner card */
.row-trigger {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: rgba(255, 255, 255, 0.94);
    border: 2px solid rgba(255, 255, 255, 0.7);
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    text-align: start;
    font-family: inherit;
    box-shadow: var(--shadow-row);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    -webkit-tap-highlight-color: rgba(255, 255, 255, 0.2);
}

.row-trigger:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 28px rgba(0, 0, 0, 0.36);
}

.row-card-header {
    background: linear-gradient(90deg, var(--row-dark) 0%, var(--row-main) 100%);
    color: #ffffff;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.row-square {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 900;
}

.row-num {
    background: rgba(255, 255, 255, 0.22);
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.2;
}

.row-emoji { font-size: 17px; line-height: 1.2; }
.row-bridge { display: none; }

.row-bar {
    padding: 12px 14px 14px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    flex: 1;
}

.row-bar-content {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.row-title { font-size: 14.5px; font-weight: 900; color: var(--ink); line-height: 1.45; }
.row-desc { font-size: 12px; color: var(--muted); font-weight: 600; line-height: 1.5; }

.row-status-pill {
    background: rgba(255, 255, 255, 0.18);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.45);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 11px;
    font-weight: 800;
    white-space: nowrap;
}

.row-trigger[aria-expanded="true"] {
    background: var(--row-soft);
    border-color: var(--row-main);
}

.row-drawer {
    grid-column: 1 / -1;
    display: none;
    background: var(--panel-bg);
    border: 2px solid var(--row-main);
    border-top: 4px solid var(--row-main);
    border-radius: var(--radius-md);
    margin-top: 4px;
    margin-bottom: 8px;
    padding: 18px;
    box-shadow: var(--shadow-drawer);
}

.row-drawer.open {
    display: block;
    animation: fadeSlide 0.22s ease;
}

@keyframes fadeSlide {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
}

.dialogue-panel {
    background: linear-gradient(145deg, #07162e 0%, #0e264b 65%, #123261 100%);
    color: #ffffff;
    border-radius: 16px;
    padding: 18px 16px;
    border: 1.5px solid rgba(56, 189, 248, 0.45);
}

.dialogue-grid-2 {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 12px;
}

.speaker-card {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 14px;
    padding: 14px;
}

.transcript-box {
    background: #ffffff;
    color: #0f172a;
    border-radius: 10px;
    padding: 10px 12px;
    min-height: 68px;
    margin-top: 8px;
    font-size: 13.5px;
    font-weight: 700;
    border: 1.5px solid #cbd5e1;
}

.level-switcher-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.lvl-filter-btn {
    padding: 6px 14px; border-radius: 8px; border: 1.5px solid var(--border);
    background: #f8fafc; color: var(--ink); font-family: inherit; font-size: 12.5px; font-weight: 800; cursor: pointer;
}
.lvl-filter-btn.active { background: var(--row-main); color: #ffffff; border-color: var(--row-main); }

.lesson-item { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; background: #fcfdff; overflow: hidden; scroll-margin-top: 80px; }
.lesson-head-btn {
    width: 100%; padding: 11px 14px; background: #f5f8fc; border: none;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    text-align: start; font-family: inherit; font-size: 14px; font-weight: 800; color: var(--ink); cursor: pointer;
}
.lesson-head-btn.open { background: var(--row-soft); color: var(--row-dark); }
.lesson-body { display: none; padding: 14px; border-top: 1px solid var(--border); background: #ffffff; }
.lesson-body.open { display: block; }

.lesson-description-box {
    background: #f0f9ff;
    border: 1px solid #bae6fd;
    border-inline-start: 4px solid #0284c7;
    border-radius: 8px;
    padding: 10px 12px;
    margin: 10px 0;
    font-size: 13px;
    color: #0f172a;
}

.video-cue-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
    font-size: 12px;
    font-weight: 800;
}

.sub-card {
    background: #f9fbfe; border: 1px solid var(--border); border-inline-start: 4px solid var(--row-main);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 12px;
}
.sub-card h4 { font-size: 14.5px; font-weight: 800; color: var(--row-dark); margin-bottom: 8px; }

.line-row, .vocab-row {
    display: flex; flex-direction: column; align-items: stretch; gap: 6px;
    padding: 10px 12px; border-radius: 8px; background: #ffffff; border: 1px solid #e2e8f0; margin-bottom: 8px;
}

.row-top-flex {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
}

.word-sentence-box {
    background: #f8fafc;
    border: 1px dashed #cbd5e1;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12.5px;
    color: #1e293b;
}

.sentence-line-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding: 6px 8px;
    margin-bottom: 5px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
}

.verb-pill {
    background: #eff6ff;
    color: #1e3a8a;
    border: 1px solid #bfdbfe;
    border-radius: 6px;
    padding: 2px 8px;
    font-weight: 800;
}

.audio-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn-audio-de, .btn-audio-fa, .btn-primary, .btn-secondary, .btn-move, .btn-scan {
    border: none; border-radius: 7px; padding: 6px 10px; font-family: inherit; font-size: 12px; font-weight: 800; cursor: pointer;
}
.btn-audio-de { background: #1d4ed8; color: #fff; }
.btn-audio-fa { background: #15803d; color: #fff; }
.btn-primary { background: var(--row-main); color: #fff; padding: 8px 15px; font-size: 13px; }
.btn-secondary { background: #e2e8f0; color: var(--ink); padding: 8px 14px; font-size: 13px; }
.btn-move { background: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1; padding: 4px 8px; font-size: 11.5px; }
.btn-scan { background: #0f766e; color: #ffffff; padding: 8px 13px; font-size: 12.5px; }

input[type="text"], input[type="number"], textarea, select {
    width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 9px;
    font-family: inherit; font-size: 13.5px; background: #fff; color: var(--ink); margin: 6px 0 10px;
}
textarea { min-height: 70px; resize: vertical; }

.result-banner {
    background: #fffbeb; border: 1px solid #fcd34d; border-inline-start: 4px solid #d97706;
    border-radius: 9px; padding: 10px 14px; margin: 10px 0; font-weight: 700; font-size: 13.5px;
}

.video-frame { width: 100%; max-width: 680px; aspect-ratio: 16 / 9; border: 0; border-radius: 10px; display: block; margin: 8px 0; }

.quiz-option-label {
    display: flex; align-items: center; gap: 8px; margin: 5px 0; padding: 7px 10px;
    border-radius: 8px; border: 1px solid #e2e8f0; font-size: 13.5px; cursor: pointer;
}
.quiz-option-label.wrong-choice { background-color: #dc2626 !important; border-color: #991b1b !important; color: #ffffff !important; font-weight: 800; }
.quiz-option-label.correct-choice { background-color: #2563eb !important; border-color: #1e40af !important; color: #ffffff !important; font-weight: 800; }
.quiz-live-score { margin-top: 10px; padding: 10px 12px; border-radius: 9px; background: #eff6ff; border: 1px solid #93c5fd; color: #1e3a8a; font-weight: 800; font-size: 13.5px; }

.book-topic-btn {
    width: 100%; text-align: start; padding: 10px 12px; border-radius: 9px; border: 1px solid #cbd5e1;
    background: #ffffff; color: #0f172a; font-family: inherit; font-size: 13.5px; font-weight: 800; cursor: pointer; margin-bottom: 6px;
}
.book-topic-btn:hover, .book-topic-btn.active { background: var(--row-soft); border-color: var(--row-main); color: var(--row-dark); }

.modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.72); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 9999; }
.modal-backdrop.open { display: flex; }
.modal-card { background: #ffffff; color: #111827; max-width: 520px; width: 100%; border-radius: 16px; padding: 22px; border-top: 5px solid #f59e0b; box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35); }

.confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 9998; overflow: hidden; }
.confetti-piece { position: absolute; top: -16px; width: 10px; height: 16px; border-radius: 2px; animation: confettiFall 2.2s linear forwards; }
@keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
}

/* Poster-inspired Footer Pill */
.site-footer {
    max-width: 1120px; margin: 22px auto 0; padding: 13px 18px; background: rgba(24, 9, 53, 0.92); color: #ffffff;
    border-radius: 999px; border: 1.5px solid rgba(250, 204, 21, 0.55); display: flex; align-items: center;
    justify-content: space-between; flex-wrap: wrap; gap: 10px; font-size: 12.5px; font-weight: 800;
}
.clock-pill { background: rgba(250, 204, 21, 0.18); color: #fde047; padding: 3px 12px; border-radius: 999px; font-variant-numeric: tabular-nums; }

@media (max-width: 900px) {
    .three-col-grid, .chaharchookat-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}
@media (max-width: 720px) {
    .dialogue-grid-2 { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
    .three-col-grid, .chaharchookat-grid {
        grid-template-columns: 1fr;
    }
    .tile-code { font-size: 22px; }
    .site-footer { border-radius: 16px; }
}
</style>
</head>
<body>

<div class="confetti-layer" id="confettiLayer"></div>

<input type="file" id="sharedOcrFileInput" accept="image/*" capture="environment" style="display:none;">

<div class="modal-backdrop" id="welcomeModal" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle">
    <div class="modal-card">
        <div style="font-size:13px;font-weight:900;color:#b45309;margin-bottom:4px;">👑 KING ASAD – مرکز آموزش زبان آلمانی
