<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KING ASAD – مرکز آموزش زبان آلمانی (A1 تا C1)</title>
<style>
:root {
    --navy: #0c1f3d;
    --blue: #174b83;
    --teal: #087e91;
    --gold: #e9b949;
    --gold-soft: #fff8e6;
    --bg: #eef3fa;
    --white: #ffffff;
    --surface: #f7faff;
    --text: #17233c;
    --muted: #5a6d86;
    --border: #d5e1ef;
    --success: #1f9d73;
    --radius-lg: 18px;
    --radius-md: 12px;
    --shadow: 0 8px 24px rgba(12, 31, 61, 0.08);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    direction: rtl;
    font-family: Tahoma, "Vazirmatn", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.85;
    min-height: 100vh;
}

/* سربرگ */
header {
    background: linear-gradient(135deg, #091529, var(--blue), var(--teal));
    color: #ffffff;
    text-align: center;
    padding: 30px 16px;
    border-bottom: 4px solid var(--gold);
}

.logo {
    display: inline-block;
    font-size: 25px;
    font-weight: bold;
    color: #ffd66b;
    letter-spacing: 2px;
    padding: 4px 16px;
    border: 1px solid rgba(255, 214, 107, 0.45);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    margin-bottom: 8px;
}

header h1 {
    font-size: 25px;
    margin-bottom: 4px;
}

header p {
    color: #e4f0ff;
    font-size: 14px;
}

main {
    max-width: 1120px;
    margin: 22px auto;
    padding: 0 14px;
}

/* چوکات اصلی هر بخش */
details.section-frame {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-lg);
    margin-bottom: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
}

details.section-frame > summary {
    list-style: none;
    cursor: pointer;
    background: linear-gradient(135deg, var(--navy), var(--blue));
    color: #ffffff;
    padding: 16px 20px;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid transparent;
}

details.section-frame[open] > summary {
    background: linear-gradient(135deg, var(--blue), var(--teal));
    border-bottom-color: var(--gold);
}

details.section-frame > summary::-webkit-details-marker {
    display: none;
}

.section-body {
    padding: 18px;
}

/* کادر توضیحات زیر هر بخش */
.desc-box {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    border-right: 5px solid var(--gold);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 14px;
}

/* چوکات هر سطح */
details.level-frame {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    margin-bottom: 14px;
    overflow: hidden;
}

details.level-frame > summary {
    list-style: none;
    cursor: pointer;
    background: #e8f1fc;
    color: var(--navy);
    padding: 14px 16px;
    font-weight: bold;
    font-size: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
