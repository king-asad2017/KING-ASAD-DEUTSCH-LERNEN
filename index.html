<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061326">
<title>KING ASAD – مرکز آموزش زبان آلمانی (A1–C1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800&family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root {
    --navy-bg: #07162e;
    --navy-card: #0c2344;
    --surface: #ffffff;
    --ink: #0f172a;
    --ink-light: #ffffff;
    --ink-muted: #cbd5e1;
    --gold: #facc15;
    --blue: #2563eb;
    --green: #16a34a;
    --orange: #ea580c;
    --rose: #db2777;
    --purple: #7c3aed;
    --cyan: #0891b2;
    --border-glow: rgba(56, 189, 248, 0.35);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    min-height: 100vh;
    font-family: "Vazirmatn", "Cairo", "Inter", Tahoma, Arial, sans-serif;
    background: radial-gradient(circle at top, #123263 0%, #07162e 55%, #040d1c 100%);
    color: var(--ink-light);
    line-height: 1.75;
    overflow-x: hidden;
}

.app-wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 18px 14px 48px;
}

.top-brand-box {
    background: linear-gradient(155deg, rgba(12, 35, 68, 0.96) 0%, rgba(7, 22, 46, 0.98) 100%);
    border: 1.5px solid var(--border-glow);
    border-radius: 22px;
    padding: 20px 18px;
    margin-bottom: 18px;
    text-align: center;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
}

.brand-title {
    font-size: clamp(20px, 3.5vw, 28px);
    font-weight: 900;
    color: #ffffff;
}
.brand-title span { color: var(--gold); }

.brand-sub {
    font-size: 13px;
    color: var(--ink-muted);
    margin-top: 6px;
}

/* گرید کارت‌های اصلی روی صفحه (فقط چند بخش منظم) */
.main-tiles-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 18px;
}

.main-tile-card {
    background: #ffffff;
    color: #0f172a;
    border: 2px solid rgba(255, 255, 255, 0.85);
    border-radius: 18px;
    padding: 16px 14px;
    text-align: start;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
    transition: transform 0.18s ease, border-color 0.18s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 8px;
}
.main-tile-card:hover {
    transform: translateY(-3px);
    border-color: var(--gold);
}
.main-tile-card.active-tile {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.35), 0 14px 28px rgba(0, 0, 0, 0.45);
}

.tile-head-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.tile-badge {
    background: #0c2344;
    color: var(--gold);
    font-size: 11.5px;
    font-weight: 900;
    padding: 3px 10px;
    border-radius: 999px;
}

.tile-name {
    font-size: 15px;
    font-weight: 900;
    color: #0f172a;
}

.tile-hint {
    font-size: 12px;
    color: #475569;
    font-weight: 700;
}

/* پنل بازشونده محتوا وقتی روی بخش کلیک می‌شود */
.opened-section-panel {
    display: none;
    background: #ffffff;
    color: #0f172a;
    border: 2px solid var(--gold);
    border-radius: 22px;
    padding: 20px 18px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.52);
    margin-bottom: 20px;
}
.opened-section-panel.open {
    display: block;
}

.panel-top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 12px;
    margin-bottom: 16px;
}

.panel-heading {
    font-size: 18px;
    font-weight: 900;
    color: #0c2344;
}

.btn-close-panel {
    background: #ef4444;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 900;
    cursor: pointer;
}

/* نوار سطوح A1 تا C1 */
.levels-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
}

.lvl-btn {
    padding: 8px 16px;
    border-radius: 10px;
    border: 1.5px solid #cbd5e1;
    background: #f1f5f9;
    color: #0f172a;
    font-family: inherit;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
}
.lvl-btn.active {
    background: #0c2344;
    color: var(--gold);
    border-color: #0c2344;
}

/* کارت درس و مشخصات */
.lesson-box {
    border: 1px solid #cbd5e1;
    border-radius: 14px;
    margin-bottom: 10px;
    background: #f8fafc;
    overflow: hidden;
}

.lesson-trigger {
    width: 100%;
    padding: 12px 14px;
    background: #eff6ff;
    border: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    text-align: start;
    font-family: inherit;
    font-size: 14px;
    font-weight: 900;
    color: #0f172a;
    cursor: pointer;
}

.lesson-details {
    display: none;
    padding: 14px;
    background: #ffffff;
    border-top: 1px solid #e2e8f0;
}
.lesson-details.open {
    display: block;
}

.specs-grid {
    background: #f0f9ff;
    border: 1px solid #bae6fd;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 10px;
    font-size: 13px;
    color: #0f172a;
}

.sentence-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
}

.clickable-speech {
    cursor: pointer;
    border-bottom: 1px dashed #2563eb;
}

/* دکمه جستجوی واضح و پررنگ در فرهنگ لغات */
.dict-search-bar {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
}

.btn-search-prominent {
    background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    color: #ffffff;
    border: 2px solid #86efac;
    border-radius: 12px;
    padding: 11px 22px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(22, 163, 74, 0.35);
    white-space: nowrap;
}
.btn-search-prominent:hover {
    background: linear-gradient(135deg, #15803d 0%, #166534 100%);
}

.btn-action {
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 900;
    cursor: pointer;
    color: #ffffff;
    background: #2563eb;
}
.btn-action.green { background: #16a34a; }
.btn-action.teal { background: #0f766e; }
.btn-action.dark { background: #0c2344; color: var(--gold); }

input[type="text"], textarea, select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #94a3b8;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13.5px;
    background: #ffffff;
    color: #0f172a;
}

textarea {
    min-height: 95px;
    resize: vertical;
}

.two-way-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.box-card {
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
}

.result-box {
    background: #fffbeb;
    border: 1px solid #fcd34d;
    border-inline-start: 4px solid #d97706;
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
    font-size: 13.5px;
    font-weight: 700;
    color: #0f172a;
}

.grammar-rule-card {
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-inline-start: 4px solid #2563eb;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
}

.podcast-item-card {
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
}

.video-frame {
    width: 100%;
    max-width: 680px;
    aspect-ratio: 16 / 9;
    border: 0;
    border-radius: 12px;
    display: block;
    margin: 8px 0;
}

.quiz-opt {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    margin: 5px 0;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    cursor: pointer;
    font-size: 13.5px;
}
.quiz-opt.ok { background: #2563eb; color: #ffffff; border-color: #1e40af; font-weight: 900; }
.quiz-opt.bad { background: #dc2626; color: #ffffff; border-color: #991b1b; font-weight: 900; }

.site-footer {
    max-width: 1080px;
    margin: 16px auto 0;
    padding: 12px 16px;
    background: rgba(6, 19, 38, 0.95);
    border: 1px solid rgba(56, 189, 248, 0.35);
    border-radius: 999px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 800;
}

@media (max-width: 860px) {
    .main-tiles-grid { grid-template-columns: repeat(2, 1fr); }
    .two-way-grid { grid-template-columns: 1fr; }
}

@media (max-width: 600px) {
    .main-tiles-grid { grid-template-columns: 1fr; }
    .dict-search-bar { grid-template-columns: 1fr; }
    .site-footer { border-radius: 16px; }
}
</style>
</head>
<body>

<input type="file" id="ocrImagePicker" accept="image/*" capture="environment" style="display:none;">

<div class="app-wrap">
    <header class="top-brand-box">
        <div class="brand-title">👑 <span>KING ASAD</span> – آموزش جامع زبان آلمانی (A1–C1)</div>
        <div class="brand-sub">روی هر بخش کلیک کنید تا درس‌ها، مشخصات و ابزارها باز شوند • تماس: <span dir="ltr">+4915212898695</span></div>
    </header>

    <!-- فقط چند بخش اصلی روی صفحه؛ با کلیک روی هر کدام، درس‌ها و مشخصات باز می‌شود -->
    <section class="main-tiles-grid" id="mainTilesGrid">
        <button type="button" class="main-tile-card" id="tile-levels" onclick="openSection('levels')">
            <div class="tile-head-row">
                <span class="tile-badge">A1 • A2 • B1 • B2 • C1</span>
                <span>📚</span>
            </div>
            <div class="tile-name">سطوح و درس‌ها (A1 تا C1)</div>
            <div class="tile-hint">کلیک کنید تا درس‌ها، مشخصات و ویدیوی هر درس باز شود</div>
        </button>

        <button type="button" class="main-tile-card" id="tile-dictionary" onclick="openSection('dictionary')">
            <div class="tile-head-row">
                <span class="tile-badge">جستجو + صدا</span>
                <span>📖</span>
            </div>
            <div class="tile-name">فرهنگ لغات آنلاین</div>
            <div class="tile-hint">جستجوی واضح لغت + کلیک روی متن برای خواندن با صدا</div>
        </button>

        <button type="button" class="main-tile-card" id="tile-twoway" onclick="openSection('twoway')">
            <div class="tile-head-row">
                <span class="tile-badge">دوطرفه + متن</span>
                <span>🔄</span>
            </div>
            <div class="tile-name">ترجمه متن دوطرفه</div>
            <div class="tile-hint">ترجمه متنی دوطرفه + خواندن متن با کلیک روی صدا</div>
        </button>

        <button type="button" class="main-tile-card" id="tile-translator" onclick="openSection('translator')">
            <div class="tile-head-row">
                <span class="tile-badge">نامحدود + اسکن</span>
                <span>🌐</span>
            </div>
            <div class="tile-name">مترجم نامحدود هر زبان به هر زبان</div>
            <div class="tile-hint">اسکن عکس + متن‌های نامحدود + پخش صدا</div>
        </button>

        <button type="button" class="main-tile-card" id="tile-grammar" onclick="openSection('grammar')">
            <div class="tile-head-row">
                <span class="tile-badge">قواعد + کتاب A1–C1</span>
                <span>📐</span>
            </div>
            <div class="tile-name">گرامر و کتاب‌های A1 تا C1</div>
            <div class="tile-hint">گرامرها، قواعد تفصیلی و کتاب‌های هر سطح</div>
        </button>

        <button type="button" class="main-tile-card" id="tile-podcasts" onclick="openSection('podcasts')">
            <div class="tile-head-row">
                <span class="tile-badge">deltalord.com</span>
                <span>🎧</span>
            </div>
            <div class="tile-name">پادکست‌های هر سطح + متن نوشتاری</div>
            <div class="tile-hint">پادکست‌های A1 تا C1 از deltalord.com با متن و صدا</div>
        </button>

        <button type="button" class="main-tile-card" id="tile-solver" onclick="openSection('solver')">
            <div class="tile-head-row">
                <span class="tile-badge">متن + اسکن عکس</span>
                <span>🧩</span>
            </div>
            <div class="tile-name">حل‌کننده نامحدود سؤال و گرامر</div>
            <div class="tile-hint">حل سؤال و توضیح گرامر با متن و اسکن عکس</div>
        </button>

        <button type="button" class="main-tile-card" id="tile-quiz" onclick="openSection('quiz')">
            <div class="tile-head-row">
                <span class="tile-badge">آزمون A1–C1</span>
                <span>✍️</span>
            </div>
            <div class="tile-name">آزمون‌های سطح A1 الی C1</div>
            <div class="tile-hint">آزمون‌های تستی هر سطح با نمره‌دهی فوری</div>
        </button>

        <button type="button" class="main-tile-card" id="tile-videos" onclick="openSection('videos')">
            <div class="tile-head-row">
                <span class="tile-badge">همه ویدیوها</span>
                <span>🎬</span>
            </div>
            <div class="tile-name">مجموعه کامل ویدیوهای آموزشی</div>
            <div class="tile-hint">همه ویدیوهای آموزشی موجود در سایت</div>
        </button>
    </section>

    <!-- پنل محتوای بازشده -->
    <section class="opened-section-panel" id="openedPanel">
        <div class="panel-top-bar">
            <h2 class="panel-heading" id="panelTitle">عنوان بخش</h2>
            <button type="button" class="btn-close-panel" onclick="closeSectionPanel()">✕ بستن بخش</button>
        </div>
        <div id="panelContent"></div>
    </section>

    <footer class="site-footer">
        <span>👑 KING ASAD • <span dir="ltr">+4915212898695</span></span>
        <span id="clockText">...</span>
    </footer>
</div>

<script>
var LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1'];

var LEVEL_INFO = {
    A1: { faName: 'مقدماتی (A1)', book: 'کتاب Schritte / Menschen A1', goal: 'معرفی خود، اعداد، زمان، خرید و جملات ساده روزمره', videoId: '4-eDoThe6qo' },
    A2: { faName: 'پایه پیشرفته (A2)', book: 'کتاب Schritte / Menschen A2', goal: 'سفر، کار، سلامتی، گذشته ساده و کامل و مکالمات روزمره', videoId: 'Lg5P2w_Ro1c' },

    B2: { faName: 'فرامیانه (B2)', book: 'کتاب Sicher / Aspekte neu B2', goal: 'تحلیل، بحث و استدلال، افعال با حرف اضافه و ساختارهای رسمی', videoId: 'ZpLXfkYC1H4' },
    C1: { faName: 'پیشرفته (C1)', book: 'کتاب Sicher / Aspekte C1', goal: 'متون علمی و تحلیلی، ظرافت‌های دستوری و بیان پیشرفته', videoId: 'lr5nQObcSY0' }
};

var LESSONS_BY_LEVEL = {
    A1: [
        { title: 'درس ۱: سلام، خداحافظی و معرفی خود', desc: 'یادگیری احوال‌پرسی رسمی و غیررسمی و معرفی نام و ملیت.', start: 8 },
        { title: 'درس ۲: اعداد، سن و روزهای هفته', desc: 'شمارش اعداد، بیان سن، روزهای هفته و ماه‌های سال.', start: 45 },
        { title: 'درس ۳: خانواده، خانه و اشیای روزمره', desc: 'واژگان اعضای خانواده، اتاق‌های خانه و حروف تعریف.', start: 95 },
        { title: 'درس ۴: خرید، رستورانت و غذاها', desc: 'سفارش غذا و نوشیدنی و پرسیدن قیمت به زبان آلمانی.', start: 145 }
    ],
    A2: [
        { title: 'درس ۱: برنامه روزانه و روتین کاری', desc: 'بیان کارهای روزانه و افعال جداشدنی (trennbare Verben).', start: 10 },
        { title: 'درس ۲: سفر، قطار و رزرو هتل', desc: 'خرید بلیت، پرسیدن مسیر و مکالمه در هتل.', start: 60 },
        { title: 'درس ۳: سلامتی، بدن و مراجعه به داکتر', desc: 'شرح علائم بیماری و گفت‌وگو با داکتر.', start: 115 },
        { title: 'درس ۴: خاطرات گذشته (Perfekt & Präteritum)', desc: 'بیان اتفاقات دیروز و هفته گذشته.', start: 170 }
    ],
    B1: [
        { title: 'درس ۱: بیان نظر، موافقت و مخالفت', desc: 'اصطلاحات استدلال و ابراز عقیده در مکالمات.', start: 12 },
        { title: 'درس ۲: کار، رزومه و مصاحبه شغلی', desc: 'معرفی مهارت‌ها و پرسش‌های رایج مصاحبه کاری.', start: 70 },
        { title: 'درس ۳: جمله مجهول (Passiv) و شرطی (Konjunktiv II)', desc: 'ساخت جملات مجهول و بیان آرزو و فرضیه.', start: 130 },
        { title: 'درس ۴: جامعه، محیط زیست و مهاجرت', desc: 'واژگان کلیدی و جملات فرعی با weil, obwohl, dass.', start: 190 }
    ],
    B2: [
        { title: 'درس ۱: استدلال تحلیلی و مناظره', desc: 'دفاع از موضع با دلیل و مثال در مباحث چالش‌برانگیز.', start: 15 },

        { title: 'درس ۴: فناوری، رسانه و اقتصاد', desc: 'واژگان تخصصی و تحلیل روندهای اجتماعی.', start: 195 }
    ],
    C1: [
        { title: 'درس ۱: تحلیل متون علمی و آکادمیک', desc: 'درک و استخراج مفاهیم دقیق در متون پیشرفته.', start: 15 },

function speakText(text, lang) {
    var clean = String(text || '').trim();
    if (!clean) return;
    var targetLang = lang || (/[\u0600-\u06FF]/.test(clean) ? 'fa-IR' : 'de-DE');
    try {
        if (window.speechSynthesis && typeof window.SpeechSynthesisUtterance === 'function') {
            window.speechSynthesis.cancel();
            var u = new window.SpeechSynthesisUtterance(clean);
            u.lang = targetLang;
            u.rate = 0.92;
            window.speechSynthesis.speak(u);
        }
    } catch (e) {}
}

function escapeJs(str) {
    return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, ' ');
}

function detectShortLang(txt) {
    var s = String(txt || '').trim();
    if (/[\u0600-\u06FF]/.test(s)) return 'fa';
    if (/[äöüÄÖÜß]/.test(s)) return 'de';
    if (/[\u0621-\u064A]/.test(s)) return 'ar';
    return 'en';
}

function translateOnline(text, fromLang, toLang, cb) {
    var clean = String(text || '').trim();
    if (!clean) { cb(''); return; }
    var src = (fromLang && fromLang !== 'auto') ? fromLang : detectShortLang(clean);
    var dst = toLang || 'de';
    if (src === dst) { cb(clean); return; }

    var url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(clean) + '&langpair=' + encodeURIComponent(src) + '|' + encodeURIComponent(dst);
    fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(d) {
            var out = (d && d.responseData && d.responseData.translatedText) ? d.responseData.translatedText.trim() : '';
            cb(out || clean);
        })
        .catch(function() { cb(clean); });
}

function startOcrForInput(inputId, doneFnName) {
    activeOcrCallback = { inputId: inputId, doneFnName: doneFnName || '' };
    var picker = document.getElementById('ocrImagePicker');
    if (picker) { picker.value = ''; picker.click(); }
}

document.addEventListener('change', function(e) {
    if (!e.target || e.target.id !== 'ocrImagePicker') return;
    var file = e.target.files && e.target.files[0];
    if (!file || !activeOcrCallback) return;
    var info = activeOcrCallback;
    var inp = document.getElementById(info.inputId);
    if (inp) inp.value = '⏳ در حال اسکن متن از عکس...';

    if (window.Tesseract && typeof window.Tesseract.recognize === 'function') {
        window.Tesseract.recognize(file, 'deu+fas+eng')
            .then(function(res) {
                var txt = (res && res.data && res.data.text) ? res.data.text.trim() : '';
                if (inp) inp.value = txt || 'متنی در عکس یافت نشد.';
                if (txt && info.doneFnName && typeof window[info.doneFnName] === 'function') {
                    window[info.doneFnName]();
                }
            })
            .catch(function() { if (inp) inp.value = 'خطا در اسکن عکس.'; });
    }
});

window.searchDictWord = function(preset) {

    if (!out) return;
    var q = (preset || (inp ? inp.value : '') || '').trim();
    if (!q) {
        out.innerHTML = '<div class="result-box">لطفاً یک لغت برای جستجو وارد کنید.</div>';
        return;
    }
    if (inp && !preset) inp.value = q;
    out.innerHTML = '<div class="result-box">⏳ در حال جستجوی لغت «' + q + '»...</div>';

    var isDe = /[a-zA-ZäöüÄÖÜß]/.test(q) && !/[\u0600-\u06FF]/.test(q);
    translateOnline(q, isDe ? 'de' : 'fa', isDe ? 'fa' : 'de', function(tr) {
        var deWord = isDe ? q : tr;
        var faWord = isDe ? tr : q;
        var exampleDe = 'Ich lerne das Wort „' + deWord + '“ heute.';
        var exampleFa = 'من امروز لغت «' + faWord + '» را یاد می‌گیرم.';

            '<div style="font-size:15px;font-weight:900;margin-bottom:8px;">' +
                '<span class="clickable-speech" onclick="speakText(\'' + escapeJs(deWord) + '\', \'de-DE\')">🇩🇪 ' + deWord + '</span>' +
                ' — ' +
                '<span class="clickable-speech" onclick="speakText(\'' + escapeJs(faWord) + '\', \'fa-IR\')">🇮🇷 ' + faWord + '</span>' +

        resBox.textContent = 'در حال ترجمه...';

                '<button type="button" class="btn-action" style="margin-top:8px;" onclick="speakText(\'' + escapeJs(tr) + '\', \'de-DE\')">🔊 خواندن ترجمه</button>';

            '<button type="button" class="btn-action" onclick="runAnyLanguageTranslation()">🌐 ترجمه متن</button>' +
            '<button type="button" class="btn-action teal" onclick="startOcrForInput(\'anyTextInput\', \'runAnyLanguageTranslation\')">📷 اسکن متن از عکس</button>' +
            '<button type="button" class="btn-action green" onclick="speakText(document.getElementById(\'anyTextInput\').value)">🔊 خواندن متن ورودی</button>' +
        '</div>' +
        '<div class="result-box" id="anyTranslateOutput" style="display:none;"></div>' +
    '</div>';
}

window.runAnyLanguageTranslation = function() {
    var inp = document.getElementById('anyTextInput');
    var src = document.getElementById('anySrcLang').value;
    var dst = document.getElementById('anyDstLang').value;
    var out = document.getElementById('anyTranslateOutput');
    if (!inp || !inp.value.trim()) return;
    out.style.display = 'block';
    out.textContent = 'در حال ترجمه...';

    var chunks = inp.value.trim().match(/[^.!?\n]+[.!?\n]?/g) || [inp.value.trim()];
    var results = new Array(chunks.length);
    var completed = 0;

    chunks.forEach(function(part, idx) {
        translateOnline(part.trim(), src, dst, function(tr) {
            results[idx] = tr;
            completed++;
            if (completed === chunks.length) {
                var joined = results.join(' ');
                out.innerHTML = '<div class="clickable-speech" onclick="speakText(\'' + escapeJs(joined) + '\')">' + joined + '</div>' +
                    '<button type="button" class="btn-action green" style="margin-top:8px;" onclick="speakText(\'' + escapeJs(joined) + '\')">🔊 خواندن ترجمه</button>';
            }
        });
    });
};

function renderSolverView(container) {
    container.innerHTML = '<div class="box-card">' +
        '<div style="font-weight:900;color:#0c2344;margin-bottom:6px;">سؤال یا جمله گرامری خود را بنویسید یا از عکس اسکن کنید:</div>' +
        '<textarea id="solverQuestionInput" placeholder="مثلاً: Ergänzen Sie: Ich ___ gestern ins Kino gegangen. یا هر سؤال گرامری دیگر..."></textarea>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
            '<button type="button" class="btn-action" onclick="solveQuestionOrGrammar()">🧩 حل سؤال و توضیح گرامر</button>' +
            '<button type="button" class="btn-action teal" onclick="startOcrForInput(\'solverQuestionInput\', \'solveQuestionOrGrammar\')">📷 اسکن سؤال از عکس</button>' +
        '</div>' +
        '<div class="result-box" id="solverAnswerBox" style="display:none;"></div>' +
    '</div>';
}

window.solveQuestionOrGrammar = function() {
    var inp = document.getElementById('solverQuestionInput');
    var box = document.getElementById('solverAnswerBox');
    if (!inp || !inp.value.trim()) return;
    var qText = inp.value.trim();
    box.style.display = 'block';
    box.textContent = '⏳ در حال تحلیل سؤال و قاعده گرامری...';

    translateOnline(qText, detectShortLang(qText), detectShortLang(qText) === 'de' ? 'fa' : 'de', function(tr) {
        var note = 'توضیح گرامری: جایگاه فعل صرف‌شده، حالت دستوری (Nominativ / Akkusativ / Dativ / Genitiv) و زمان فعل را با فاعل جمله بررسی کنید.';
        if (/gegangen|gefahren|gekommen|gewesen/i.test(qText)) {
            note = 'توضیح گرامری: برای افعال حرکتی و تغییر حالت در گذشته کامل (Perfekt) از فعل کمکی sein (bin / bist / ist / sind) استفاده می‌شود.';
        } else if (/werden|wurde|würde/i.test(qText)) {
            note = 'توضیح گرامری: این ساختار به جمله مجهول (Passiv) یا وجه شرطی (Konjunktiv II) مربوط است و فعل اصلی به صورت Infinitiv یا Partizip II می‌آید.';
        }
        box.innerHTML = '<div><strong>متن سؤال:</strong> ' + qText + '</div>' +
            '<div style="color:#1e3a8a;margin-top:6px;"><strong>ترجمه / معادل:</strong> ' + tr + '</div>' +
            '<div class="clickable-speech" style="margin-top:6px;" onclick="speakText(\'' + escapeJs(note) + '\', \'fa-IR\')"><strong>راه‌حل و توضیح:</strong> ' + note + '</div>';
    });
};

/* ۸. آزمون‌های سطح A1 الی C1 */
function renderQuizView(container) {
    var html = '<div class="levels-bar">';
    LEVELS.forEach(function(lvl) {
        html += '<button type="button" class="lvl-btn' + (lvl === selectedQuizLevel ? ' active' : '') + '" onclick="changeQuizLevel(\'' + lvl + '\')">' + lvl + '</button>';
    });
    html += '</div>';

    var qs = QUIZ_BY_LEVEL[selectedQuizLevel] || [];
    var score = 0;

    qs.forEach(function(item, qIdx) {
        var key = selectedQuizLevel + '_' + qIdx;
        var picked = quizAnswers[key];
        if (picked === item.ans) score++;

        html += '<div class="box-card"><div style="font-weight:900;margin-bottom:6px;">سؤال ' + (qIdx + 1) + ': ' + item.q + '</div>';
        item.opts.forEach(function(op, oIdx) {
            var cls = 'quiz-opt';
            if (picked !== undefined) {
                if (oIdx === item.ans) cls += ' ok';
                else if (oIdx === picked) cls += ' bad';
            }
            html += '<div class="' + cls + '" onclick="pickQuizAnswer(\'' + selectedQuizLevel + '\', ' + qIdx + ', ' + oIdx + ')">' +
                '<span>' + op + '</span>' +
            '</div>';
        });
        html += '</div>';
    });

    html += '<div class="result-box">امتیاز شما در آزمون ' + selectedQuizLevel + ': <strong>' + score + ' از ' + qs.length + '</strong></div>';
    container.innerHTML = html;
}

window.changeQuizLevel = function(lvl) {
    selectedQuizLevel = lvl;
    renderQuizView(document.getElementById('panelContent'));
};

window.pickQuizAnswer = function(lvl, qIdx, oIdx) {
    quizAnswers[lvl + '_' + qIdx] = oIdx;
    renderQuizView(document.getElementById('panelContent'));
};

function tickClock() {
    var el = document.getElementById('clockText');
    if (!el) return;
    var now = new Date();
    el.textContent = now.toLocaleDateString('fa-IR') + ' • ' + now.toLocaleTimeString('de-DE');
}

tickClock();
setInterval(tickClock, 1000);
