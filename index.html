<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b18">
<title>KING ASAD DEUTSCH LERNEN – مرکز آموزشی و سایت آنلاین</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Cinzel:wght@700;800;900&family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root {
    --bg-black: #050a14;
    --bg-navy: #0b2144;
    --bg-white-soft: rgba(255, 255, 255, 0.94);
    --ink-dark: #0b1528;
    --ink-light: #ffffff;
    --gold: #facc15;
    --sky: #38bdf8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    min-height: 100vh;
    font-family: "Vazirmatn", "Cairo", Tahoma, Arial, sans-serif;
    background-color: var(--bg-black);
    color: var(--ink-light);
    line-height: 1.75;
    overflow-x: hidden;
    position: relative;
}

/* پس‌زمینه عکس محصل‌ها + گرادیانت سیاه، آبی و سفید کم‌رنگ */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(165deg, rgba(5, 10, 20, 0.84) 0%, rgba(11, 33, 68, 0.78) 52%, rgba(248, 250, 252, 0.16) 100%),
        url("https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1600&q=70");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    z-index: -1;
    pointer-events: none;
}

.app-container {
    max-width: 1040px;
    margin: 0 auto;
    padding: 20px 16px 56px;
}

/* هدر اصلی با نام بزرگ، پرچم آلمان و افغانستان در دو طرف، و ساعت/تاریخ جهانی در پایین نام */
.hero-header-box {
    background: linear-gradient(150deg, rgba(5, 12, 26, 0.92) 0%, rgba(12, 37, 77, 0.90) 60%, rgba(226, 232, 240, 0.18) 100%);
    backdrop-filter: blur(8px);
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 26px;
    padding: 26px 18px;
    margin-bottom: 22px;
    text-align: center;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55);
}

.site-name-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 8px;
}

.flag-side {
    font-size: clamp(32px, 5vw, 46px);
    line-height: 1;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
}

.main-brand-title {
    font-family: "Cinzel", "Vazirmatn", sans-serif;
    font-size: clamp(26px, 5.2vw, 46px);
    font-weight: 900;
    letter-spacing: 1px;
    color: #ffffff;
    text-shadow: 0 4px 18px rgba(0, 0, 0, 0.65);
}

.main-brand-title span {
    color: var(--gold);
}

.site-center-subtitle {
    font-size: clamp(16px, 2.8vw, 22px);
    font-weight: 900;
    color: #e0f2fe;
    background: rgba(255, 255, 255, 0.12);
    display: inline-block;
    padding: 5px 18px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.28);
    margin-bottom: 12px;
}

.world-datetime-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    background: rgba(5, 10, 20, 0.78);
    border: 1.5px solid rgba(250, 204, 21, 0.55);
    border-radius: 16px;
    padding: 10px 18px;
    max-width: 720px;
    margin: 0 auto;
    font-size: clamp(13.5px, 2.2vw, 16px);
    font-weight: 900;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
}

/* چهارچوکات‌های بزرگ شبیه تصویر ارسالی و بخش‌های اصلی */
.big-cards-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-bottom: 22px;
}

.big-section-card {
    background: var(--bg-white-soft);
    color: var(--ink-dark);
    border: 2.5px solid rgba(255, 255, 255, 0.9);
    border-radius: 22px;
    padding: 20px 18px;
    text-align: start;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.42);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 145px;
}
.big-section-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 38px rgba(0, 0, 0, 0.52);
}
.big-section-card.selected-card {
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.45), 0 18px 38px rgba(0, 0, 0, 0.55);
}

.card-top-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
}

.card-pill-tag {
    background: #0b2144;
    color: var(--gold);
    font-size: 12.5px;
    font-weight: 900;
    padding: 4px 12px;
    border-radius: 999px;
}

.card-emoji-big {
    font-size: 26px;
}

.card-big-title {
    font-size: clamp(17px, 2.5vw, 21px);
    font-weight: 900;
    color: #071428;
    margin-bottom: 5px;
}

.card-big-desc {
    font-size: 13.5px;
    font-weight: 700;
    color: #334155;
}

/* پنل بازشونده بزرگ محتوا */
.content-drawer-box {
    display: none;
    background: rgba(255, 255, 255, 0.97);
    color: var(--ink-dark);
    border: 2.5px solid #38bdf8;
    border-radius: 24px;
    padding: 22px 18px;
    box-shadow: 0 20px 46px rgba(0, 0, 0, 0.55);
    margin-bottom: 22px;
}
.content-drawer-box.open {
    display: block;
}

.drawer-top-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 2px solid #cbd5e1;
    padding-bottom: 12px;
    margin-bottom: 16px;
}

.drawer-main-title {
    font-size: clamp(18px, 3vw, 23px);
    font-weight: 900;
    color: #0b2144;
}

.btn-close-drawer {
    background: #dc2626;
    color: #ffffff;
    border: none;
    border-radius: 12px;
    padding: 8px 16px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
}

/* ردیف‌های افقی بزرگ شبیه عکس ارسالی */
.level-horizontal-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 18px;
}

.level-h-row {
    display: flex;
    align-items: stretch;
    border-radius: 18px;
    overflow: hidden;
    background: #ffffff;
    border: 2px solid #cbd5e1;
    cursor: pointer;
    text-align: start;
    font-family: inherit;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.14);
    transition: transform 0.16s ease;
    width: 100%;
}
.level-h-row:hover { transform: translateY(-2px); }
.level-h-row.active-row { border-color: #0b2144; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25); }

.h-badge {
    min-width: 88px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 900;
    color: #ffffff;
    padding: 14px 10px;
}

.h-A1 .h-badge { background: #2563eb; }
.h-A2 .h-badge { background: #16a34a; }
.h-B1 .h-badge { background: #eab308; color: #0f172a; }
.h-B2 .h-badge { background: #ea580c; }
.h-C1 .h-badge { background: #db2777; }

.h-info {
    flex: 1;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.h-title { font-size: 16.5px; font-weight: 900; color: #0f172a; }
.h-sub { font-size: 12.5px; font-weight: 700; color: #475569; }

.h-arrow {
    display: flex;
    align-items: center;
    padding: 0 16px;
    font-size: 22px;
    font-weight: 900;
    color: #0b2144;
}

.lesson-card-item {
    border: 1.5px solid #cbd5e1;
    border-radius: 16px;
    margin-bottom: 12px;
    background: #f8fafc;
    overflow: hidden;
}

.lesson-head-trigger {
    width: 100%;
    padding: 14px 16px;
    background: #e0f2fe;
    border: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    text-align: start;
    font-family: inherit;
    font-size: 15px;
    font-weight: 900;
    color: #0b2144;
    cursor: pointer;
}

.lesson-body-panel {
    display: none;
    padding: 16px;
    background: #ffffff;
    border-top: 1px solid #cbd5e1;
}
.lesson-body-panel.open { display: block; }

.video-player-wrap {
    background: #050a14;
    border-radius: 14px;
    padding: 12px;
    margin: 12px 0;
    color: #ffffff;
}

.video-embed-box {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
    border-radius: 10px;
    display: block;
    background: #000000;
}

.video-fallback-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.16);
    font-size: 12.5px;
}

.btn-yt-watch {
    background: #dc2626;
    color: #ffffff;
    text-decoration: none;
    padding: 7px 14px;
    border-radius: 9px;
    font-weight: 900;
    font-size: 12.5px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.btn-ui {
    border: none;
    border-radius: 10px;
    padding: 9px 15px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
    color: #ffffff;
    background: #2563eb;
}
.btn-ui.green { background: #16a34a; }
.btn-ui.teal { background: #0f766e; }
.btn-ui.dark { background: #0b2144; color: var(--gold); }

.btn-search-big {
    background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    color: #ffffff;
    border: 2px solid #86efac;
    border-radius: 12px;
    padding: 11px 22px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 900;
    cursor: pointer;
    white-space: nowrap;
}

input[type="text"], textarea, select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #94a3b8;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    background: #ffffff;
    color: #0f172a;
}

textarea { min-height: 95px; resize: vertical; }

.search-flex-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
}

.two-col-box {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.info-box {
    background: #f8fafc;
    border: 1.5px solid #cbd5e1;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
}

.notice-box {
    background: #fffbeb;
    border: 1.5px solid #f59e0b;
    border-inline-start: 4px solid #d97706;
    border-radius: 12px;
    padding: 12px 14px;
    margin-top: 10px;
    font-size: 13.5px;
    font-weight: 700;
    color: #0f172a;
}

.speak-clickable {
    cursor: pointer;
    border-bottom: 1px dashed #2563eb;
}

.quiz-choice {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    margin: 6px 0;
    border-radius: 10px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    cursor: pointer;
    font-weight: 700;
}
.quiz-choice.correct { background: #2563eb; color: #ffffff; border-color: #1e40af; }
.quiz-choice.wrong { background: #dc2626; color: #ffffff; border-color: #991b1b; }

@media (max-width: 820px) {
    .big-cards-grid, .two-col-box { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
    .search-flex-row { grid-template-columns: 1fr; }
    .h-badge { min-width: 68px; font-size: 20px; }
}
</style>
</head>
<body>

<input type="file" id="photoScanInput" accept="image/*" capture="environment" style="display:none;">

<div class="app-container">
    <!-- هدر اصلی مطابق درخواست -->
    <header class="hero-header-box">
        <div class="site-name-row">
            <span class="flag-side">🇩🇪</span>

        <div class="site-center-subtitle">مرکز آموزشی و سایت آنلاین</div>

    <!-- چهارچوکات‌های بزرگ روی صفحه اصلی -->

            <div class="card-big-desc">ترجمه متنی دوطرفه همراه با دکمه خواندن متن با صدا</div>
        </button>

        <button type="button" class="big-section-card" id="card-translator" onclick="openBigSection('translator')">

            <div class="card-big-title">مترجم نامحدود هر زبان به هر زبان</div>
            <div class="card-big-desc">متن‌های طولانی و نامحدود + اسکن متن از عکس + صدا</div>
        </button>

        <button type="button" class="big-section-card" id="card-grammar" onclick="openBigSection('grammar')">
            <div class="card-top-line">

                <span class="card-emoji-big">📐</span>
            </div>
            <div class="card-big-title">گرامر و کتاب‌های A1 تا C1</div>
            <div class="card-big-desc">قواعد گرامری کامل و کتاب‌های آموزشی هر سطح</div>
        </button>

        <button type="button" class="big-section-card" id="card-podcasts" onclick="openBigSection('podcasts')">
            <div class="card-top-line">
                <span class="card-pill-tag">deltalord.com + متن</span>
                <span class="card-emoji-big">🎧</span>
            </div>
            <div class="card-big-title">پادکست‌های هر سطح با متن نوشتاری</div>
            <div class="card-big-desc">پادکست‌های A1 تا C1 از deltalord.com با متن و پخش صدا</div>
        </button>

        <button type="button" class="big-section-card" id="card-solver" onclick="openBigSection('solver')">
            <div class="card-top-line">
                <span class="card-pill-tag">متن + اسکن عکس</span>
                <span class="card-emoji-big">🧩</span>
            </div>
            <div class="card-big-title">حل‌کننده نامحدود سؤال و گرامر</div>
            <div class="card-big-desc">حل و توضیح سؤال‌های گرامری با متن و اسکن عکس</div>
        </button>

        <button type="button" class="big-section-card" id="card-quiz" onclick="openBigSection('quiz')">
            <div class="card-top-line">
                <span class="card-pill-tag">آزمون A1 الی C1</span>
                <span class="card-emoji-big">✍️</span>
            </div>
            <div class="card-big-title">آزمون‌های سطح A1 الی C1</div>
            <div class="card-big-desc">آزمون‌های تعاملی هر سطح با امتیاز فوری</div>
        </button>

        <button type="button" class="big-section-card" id="card-videos" style="grid-column: 1 / -1;" onclick="openBigSection('videos')">
            <div class="card-top-line">
                <span class="card-pill-tag">پخش منظم ویدیوها</span>
                <span class="card-emoji-big">🎬</span>
            </div>
            <div class="card-big-title">مجموعه کامل ویدیوهای آموزشی</div>
            <div class="card-big-desc">همه ویدیوهای آموزشی با پخش منظم و دکمه بازشدن مستقیم در یوتیوب</div>
        </button>
    </section>

    <!-- پنجره بازشونده محتوا -->
    <section class="content-drawer-box" id="drawerBox">
        <div class="drawer-top-head">
            <h2 class="drawer-main-title" id="drawerTitle">عنوان بخش</h2>
            <button type="button" class="btn-close-drawer" onclick="closeDrawer()">✕ بستن</button>
        </div>
        <div id="drawerBody"></div>
    </section>
</div>

var LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1'];

var LEVEL_META = {

    B2: { fa: 'سطح فرامیانه (B2)', sub: 'Upper-Intermediate • بحث تحلیلی، افعال با حرف اضافه و متون رسمی', book: 'کتاب Sicher / Aspekte neu B2', videoId: 'ZpLXfkYC1H4', start: 15 },

};

var LESSONS = {
    A1: [
        { title: 'درس ۱: سلام، خداحافظی و معرفی خود', desc: 'آشنایی با سلام‌های روزمره، معرفی نام، شهر و ملیت به زبان آلمانی.', start: 8 },

        { title: 'درس ۳: خانواده، خانه و حروف تعریف', desc: 'اعضای خانواده، اتاق‌های خانه و کاربرد der, die, das.', start: 95 },

function readOutLoud(text, forcedLang) {
    var clean = String(text || '').trim();
    if (!clean) return;
    var lang = forcedLang || (/[\u0600-\u06FF]/.test(clean) ? 'fa-IR' : 'de-DE');
    try {
        if (window.speechSynthesis && typeof window.SpeechSynthesisUtterance === 'function') {
            window.speechSynthesis.cancel();
            var utter = new window.SpeechSynthesisUtterance(clean);
            utter.lang = lang;
            utter.rate = 0.92;
            window.speechSynthesis.speak(utter);
        }
    } catch (e) {}
}

function escapeQuote(s) {
    return String(s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, ' ');
}

function renderVideoPlayerHtml(videoId, startSec, title) {
    var st = startSec || 0;
    var embedUrl = 'https://www.youtube.com/embed/' + videoId + '?start=' + st + '&rel=0';
    var watchUrl = 'https://www.youtube.com/watch?v=' + videoId + (st > 0 ? '&t=' + st + 's' : '');
    return '<div class="video-player-wrap">' +
        '<iframe class="video-embed-box" src="' + embedUrl + '" title="' + title + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>' +
        '<div class="video-fallback-bar">' +
            '<span>اگر پخش داخلی توسط مرورگر یا شبکه مسدود شد، با دکمه کنار مستقیم باز کنید:</span>' +
            '<a class="btn-yt-watch" href="' + watchUrl + '" target="_blank" rel="noopener">▶ پخش مستقیم در یوتیوب</a>' +
        '</div>' +
    '</div>';
}

function guessShortLang(txt) {
    var t = String(txt || '').trim();
    if (/[\u0600-\u06FF]/.test(t)) return 'fa';
    if (/[äöüÄÖÜß]/.test(t)) return 'de';
    if (/[\u0621-\u064A]/.test(t)) return 'ar';
    return 'en';
}

function translateText(text, fromShort, toShort, done) {
    var clean = String(text || '').trim();
    if (!clean) { done(''); return; }
    var src = (fromShort && fromShort !== 'auto') ? fromShort : guessShortLang(clean);
    var dst = toShort || 'de';
    if (src === dst) { done(clean); return; }

    var url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(clean) + '&langpair=' + encodeURIComponent(src) + '|' + encodeURIComponent(dst);
    fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(d) {
            var res = (d && d.responseData && d.responseData.translatedText) ? d.responseData.translatedText.trim() : '';
            done(res || clean);
        })
        .catch(function() { done(clean); });
}

function triggerScan(inputId, callbackFnName) {
    pendingOcr = { inputId: inputId, callbackFnName: callbackFnName || '' };
    var picker = document.getElementById('photoScanInput');
    if (picker) { picker.value = ''; picker.click(); }
}

document.addEventListener('change', function(e) {
    if (!e.target || e.target.id !== 'photoScanInput') return;
    var file = e.target.files && e.target.files[0];
    if (!file || !pendingOcr) return;
    var info = pendingOcr;
    var inp = document.getElementById(info.inputId);
    if (inp) inp.value = '⏳ در حال اسکن متن از عکس...';

    if (window.Tesseract && typeof window.Tesseract.recognize === 'function') {
        window.Tesseract.recognize(file, 'deu+fas+eng')
            .then(function(res) {
                var txt = (res && res.data && res.data.text) ? res.data.text.trim() : '';
                if (inp) inp.value = txt || 'متنی در عکس تشخیص داده نشد.';
                if (txt && info.callbackFnName && typeof window[info.callbackFnName] === 'function') {
                    window[info.callbackFnName]();
                }
            })
            .catch(function() { if (inp) inp.value = 'خطا در اسکن عکس.'; });
    }
});

window.doUnlimitedTranslate = function() {
    var inp = document.getElementById('unlimitedTextInp');
    var f = document.getElementById('langFromSel').value;
    var t = document.getElementById('langToSel').value;
    var out = document.getElementById('unlimitedTranslateRes');
    if (!inp || !inp.value.trim()) return;
    out.style.display = 'block';
    out.textContent = 'در حال ترجمه...';

    var parts = inp.value.trim().match(/[^.!?\n]+[.!?\n]?/g) || [inp.value.trim()];
    var results = new Array(parts.length);
    var doneCount = 0;

    parts.forEach(function(seg, i) {
        translateText(seg.trim(), f, t, function(tr) {
            results[i] = tr;
            doneCount++;
            if (doneCount === parts.length) {
                var full = results.join(' ');
                out.innerHTML = '<div class="speak-clickable" onclick="readOutLoud(\'' + escapeQuote(full) + '\')">' + full + '</div>' +
                    '<button type="button" class="btn-ui green" style="margin-top:8px;" onclick="readOutLoud(\'' + escapeQuote(full) + '\')">🔊 خواندن ترجمه</button>';
            }
        });
    });
};

window.solveGrammarQuestion = function() {
    var inp = document.getElementById('solverInp');
    var out = document.getElementById('solverOut');
    if (!inp || !inp.value.trim()) return;
    var q = inp.value.trim();
    out.style.display = 'block';
    out.textContent = '⏳ در حال تحلیل...';

    translateText(q, guessShortLang(q), guessShortLang(q) === 'de' ? 'fa' : 'de', function(tr) {
        var ruleNote = 'توضیح گرامری: جایگاه فعل صرف‌شده، حالت دستوری (Nominativ / Akkusativ / Dativ / Genitiv) و زمان فعل را بررسی کنید.';
        if (/gegangen|gefahren|gekommen|gewesen/i.test(q)) {
            ruleNote = 'توضیح گرامری: برای افعال حرکتی یا تغییر حالت در گذشته کامل (Perfekt) از فعل کمکی sein استفاده می‌شود.';
        } else if (/werden|wurde|würde/i.test(q)) {
            ruleNote = 'توضیح گرامری: این عبارت به ساختار مجهول (Passiv) یا شرطی (Konjunktiv II) مربوط است.';
        }
        out.innerHTML = '<div><strong>سؤال:</strong> ' + q + '</div>' +
            '<div style="color:#1e3a8a;margin-top:6px;"><strong>ترجمه:</strong> ' + tr + '</div>' +
            '<div class="speak-clickable" style="margin-top:6px;" onclick="readOutLoud(\'' + escapeQuote(ruleNote) + '\', \'fa-IR\')"><strong>راه‌حل:</strong> ' + ruleNote + '</div>';
    });
};

/* ۸. آزمون‌های سطح A1 الی C1 */
function paintQuizSection(container) {
    var html = '<div class="level-horizontal-list" style="flex-direction:row;flex-wrap:wrap;gap:8px;">';
    LEVELS.forEach(function(lvl) {
        html += '<button type="button" class="btn-ui' + (lvl === curQuizLevel ? ' dark' : '') + '" onclick="pickQuizLvl(\'' + lvl + '\')">' + lvl + '</button>';
    });
    html += '</div>';

    var qs = QUIZZES[curQuizLevel] || [];
    var score = 0;

    qs.forEach(function(item, qIdx) {
        var key = curQuizLevel + '_' + qIdx;
        var chosen = quizPicked[key];
        if (chosen === item.ans) score++;

        html += '<div class="info-box"><div style="font-weight:900;margin-bottom:6px;">سؤال ' + (qIdx + 1) + ': ' + item.q + '</div>';
        item.opts.forEach(function(op, oIdx) {
            var cls = 'quiz-choice';
            if (chosen !== undefined) {
                if (oIdx === item.ans) cls += ' correct';
                else if (oIdx === chosen) cls += ' wrong';
            }
            html += '<div class="' + cls + '" onclick="chooseAnswer(\'' + curQuizLevel + '\', ' + qIdx + ', ' + oIdx + ')">' + op + '</div>';
        });
        html += '</div>';
    });

    html += '<div class="notice-box">امتیاز شما در سطح ' + curQuizLevel + ': <strong>' + score + ' از ' + qs.length + '</strong></div>';
    container.innerHTML = html;
}

window.pickQuizLvl = function(lvl) {
    curQuizLevel = lvl;
    paintQuizSection(document.getElementById('drawerBody'));
};

window.chooseAnswer = function(lvl, qIdx, oIdx) {
    quizPicked[lvl + '_' + qIdx] = oIdx;
    paintQuizSection(document.getElementById('drawerBody'));
};

function refreshWorldDateTime() {
    var el = document.getElementById('worldDateTimeDisplay');
    if (!el) return;
    var now = new Date();
    var globalDate = now.toLocaleDateString('en-GB', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        timeZone: 'UTC'
    });
    var globalTime = now.toLocaleTimeString('en-GB', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        timeZone: 'UTC'
    });
    el.innerHTML = '<span>🌍 تاریخ جهانی (UTC): ' + globalDate + '</span><span>•</span><span>🕒 ساعت جهانی (UTC): ' + globalTime + '</span>';
}

refreshWorldDateTime();
